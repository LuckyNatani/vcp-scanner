<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VCP Scanner · NSE</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Lato', sans-serif; background: #f0f2f5; color: #111; font-size: 16px; }

.header {
  background: #1a56db; color: white;
  padding: 14px 20px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
}
.header h1 { font-size: 1.3rem; font-weight: 900; }
.header h1 span { color: #93c5fd; }
.header p  { font-size: 0.75rem; color: #bfdbfe; margin-top: 2px; }
.header-right { text-align: right; font-size: 0.8rem; color: #bfdbfe; line-height: 1.6; }
.header-right strong { color: #fff; }
.btn-refresh {
  background: white; color: #1a56db; border: none; border-radius: 6px;
  padding: 5px 14px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
  font-family: 'Lato', sans-serif; margin-top: 4px;
}

.mkt-strip { display:none; text-align:center; padding:9px 20px; font-size:0.85rem; font-weight:700; }
.mkt-strip.up   { background:#f0fdf4; color:#15803d; border-bottom:2px solid #86efac; }
.mkt-strip.down { background:#fef2f2; color:#b91c1c; border-bottom:2px solid #fca5a5; }

.stats { background:#fff; border-bottom:2px solid #e5e7eb; display:flex; flex-wrap:wrap; }
.stat  { flex:1; min-width:90px; padding:12px 16px; text-align:center; border-right:1px solid #e5e7eb; }
.stat:last-child { border-right:none; }
.stat .n { font-size:1.6rem; font-weight:900; color:#1a56db; line-height:1; }
.stat .l { font-size:0.65rem; color:#9ca3af; margin-top:3px; text-transform:uppercase; letter-spacing:.05em; }

.cards { padding:14px 14px 40px; display:flex; flex-direction:column; gap:14px; max-width:680px; margin:0 auto; }

.card { background:#fff; border-radius:14px; border:1.5px solid #e5e7eb; box-shadow:0 2px 6px rgba(0,0,0,0.05); overflow:hidden; }

.card-top {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 12px; border-bottom:1.5px solid #f3f4f6; flex-wrap:wrap; gap:8px;
}
.sym-wrap { display:flex; align-items:center; gap:10px; }
.rank-dot {
  width:34px; height:34px; border-radius:50%; background:#1a56db; color:white;
  font-size:1rem; font-weight:900; display:flex; align-items:center; justify-content:center;
}
.sym-name { font-size:1.4rem; font-weight:900; }
.sym-sub  { font-size:0.7rem; color:#9ca3af; margin-top:1px; }
.badge { padding:6px 14px; border-radius:10px; font-size:0.78rem; font-weight:700; border:1.5px solid; text-align:center; }

.chart-wrap { background:#fafafa; border-bottom:1.5px solid #f3f4f6; padding:4px 8px 2px; }
.chart-sub  { font-size:0.68rem; color:#9ca3af; text-align:center; margin-bottom:2px; }
canvas { display:block; width:100%; }

.numbers { display:grid; grid-template-columns:1fr 1fr 1fr; border-bottom:1.5px solid #f3f4f6; }
.num-cell { padding:12px 14px; text-align:center; border-right:1px solid #f3f4f6; }
.num-cell:last-child { border-right:none; }
.num-cell .lbl { font-size:0.65rem; color:#9ca3af; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.num-cell .val { font-size:1.15rem; font-weight:900; }

.actions { display:grid; grid-template-columns:1fr 1fr; }
.action-cell { padding:14px 18px; border-right:1px solid #f3f4f6; border-top:1.5px solid #f3f4f6; }
.action-cell:nth-child(even) { border-right:none; }
.action-cell .a-lbl   { font-size:0.7rem; color:#9ca3af; text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }
.action-cell .a-price { font-size:1.25rem; font-weight:900; }
.action-cell .a-note  { font-size:0.7rem; color:#9ca3af; margin-top:2px; }

.card-foot { background:#f9fafb; border-top:1.5px solid #f3f4f6; padding:9px 18px; display:flex; flex-wrap:wrap; gap:6px; }
.tag { font-size:0.72rem; font-weight:700; padding:3px 10px; border-radius:20px; border:1px solid; }
.tg  { background:#f0fdf4; color:#15803d; border-color:#86efac; }
.ta  { background:#fffbeb; color:#92400e; border-color:#fcd34d; }
.tb  { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
.tr  { background:#fef2f2; color:#b91c1c; border-color:#fca5a5; }

.empty { background:#fff; border:1.5px solid #e5e7eb; border-radius:14px; padding:50px 20px; text-align:center; margin:14px auto 0; max-width:680px; }
.empty h2 { font-size:1.2rem; color:#374151; margin-bottom:8px; }
.empty p  { color:#9ca3af; font-size:0.9rem; line-height:1.7; }
.empty .ok { color:#15803d; font-weight:700; margin-top:10px; }

footer { text-align:center; padding:14px; font-size:0.7rem; color:#9ca3af; border-top:1px solid #e5e7eb; background:#fff; margin-top:8px; }

#loading { position:fixed; inset:0; background:#f0f2f5; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; transition:opacity .3s; gap:12px; }
#loading.hidden { opacity:0; pointer-events:none; }
.spin { width:40px; height:40px; border:3px solid #dbeafe; border-top-color:#1a56db; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#loading p { font-size:0.9rem; color:#6b7280; font-weight:700; }

.c-buy  { color:#1d4ed8; }
.c-stop { color:#dc2626; }
.c-t1   { color:#15803d; }
.c-t2   { color:#047857; }
.c-pur  { color:#7c3aed; }
.c-now  { color:#111827; }

@media(max-width:400px){
  .numbers { grid-template-columns:1fr 1fr; }
  .actions { grid-template-columns:1fr; }
  .action-cell { border-right:none; }
}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p>Loading…</p></div>

<div class="header">
  <div>
    <h1>📈 VCP <span>Scanner</span> · NSE</h1>
    <p>Pre-breakout setups · Auto-scan 6:30 AM IST weekdays</p>
  </div>
  <div class="header-right">
    <strong id="scan-date">—</strong><br>
    Updated <span id="scan-time">—</span><br>
    <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div class="mkt-strip" id="mkt"></div>
<div class="stats" id="stats"></div>
<div class="cards" id="cards"></div>

<footer>Not financial advice · Always use stop loss · Risk max 1–2% per trade</footer>

<script>
function drawChart(canvas, candles, pivot, entry) {
  const dpr=window.devicePixelRatio||1, W=canvas.parentElement.clientWidth-16, H=120;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  if(!candles?.length) return;
  const P={t:10,b:20,l:4,r:4}, cW=W-P.l-P.r, cH=H-P.t-P.b;
  const hi=Math.max(...candles.map(c=>c[1])), lo=Math.min(...candles.map(c=>c[2]));
  const pad=(hi-lo)*0.12, pMax=hi+pad, pMin=lo-pad;
  const ys=p=>P.t+cH-((p-pMin)/(pMax-pMin))*cH;
  const xs=i=>P.l+(i/(candles.length-1))*cW;
  const bw=Math.max(2,Math.floor(cW/candles.length)-1);
  ctx.fillStyle='#fafafa'; ctx.fillRect(0,0,W,H);
  [1,2,3].forEach(i=>{ ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;const y=P.t+cH/4*i;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke(); });
  const maxV=Math.max(...candles.map(c=>c[4])), vH=cH*0.2;
  candles.forEach((c,i)=>{ ctx.fillStyle=c[3]>=c[0]?'rgba(22,163,74,.15)':'rgba(220,38,38,.15)'; ctx.fillRect(xs(i)-bw/2,P.t+cH-(c[4]/maxV)*vH,bw,(c[4]/maxV)*vH); });
  if(pivot&&entry){const py=ys(pivot),ey=ys(entry);ctx.fillStyle='rgba(124,58,237,0.06)';ctx.fillRect(P.l,Math.min(py,ey),cW,Math.abs(py-ey)+2);}
  if(pivot){const py=ys(pivot);if(py>P.t&&py<P.t+cH){ctx.setLineDash([4,4]);ctx.strokeStyle='#7c3aed';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(P.l,py);ctx.lineTo(P.l+cW,py);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#7c3aed';ctx.font='bold 9px Lato';ctx.fillText('BUY ZONE',P.l+cW-54,py-3);}}
  candles.forEach((c,i)=>{ const x=xs(i),bull=c[3]>=c[0];ctx.strokeStyle=bull?'#16a34a':'#dc2626';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,ys(c[1]));ctx.lineTo(x,ys(c[2]));ctx.stroke();const bT=ys(Math.max(c[0],c[3])),bB=ys(Math.min(c[0],c[3]));ctx.fillStyle=bull?'rgba(22,163,74,.8)':'rgba(220,38,38,.8)';ctx.fillRect(x-bw/2,bT,bw,Math.max(1,bB-bT)); });
  ctx.fillStyle='#9ca3af';ctx.font='9px Lato';ctx.fillText('50d ago',P.l,H-4);ctx.fillText('Today',P.l+cW-30,H-4);
}

function buildCard(s, rank) {
  const card=document.createElement('div'); card.className='card';
  const sc=s.vcp_score;
  const bbg=sc>=70?'#f0fdf4':sc>=50?'#fffbeb':'#eff6ff';
  const bbd=sc>=70?'#86efac':sc>=50?'#fcd34d':'#bfdbfe';
  const bco=sc>=70?'#15803d':sc>=50?'#d97706':'#1d4ed8';
  const btx=sc>=70?'🔥 Strong':sc>=50?'✅ Good':'⚡ Moderate';
  const rs=s.rs_vs_nifty;
  const rsTag=rs!=null?`<span class="tag ${rs>=0?'tg':'tr'}">VS NIFTY ${rs>=0?'+':''}${parseFloat(rs).toFixed(1)}%</span>`:'';
  const rr=parseFloat(s.risk_reward||0).toFixed(1);
  const dist=parseFloat(s.dist_pct||0).toFixed(1);

  card.innerHTML=`
    <div class="card-top">
      <div class="sym-wrap">
        <div class="rank-dot">${rank}</div>
        <div><div class="sym-name">${s.symbol}</div><div class="sym-sub">NSE · Score ${s.vcp_score}/100</div></div>
      </div>
      <div class="badge" style="background:${bbg};border-color:${bbd};color:${bco}">${btx}</div>
    </div>
    <div class="chart-wrap">
      <div class="chart-sub">50-day chart · Purple line = Buy Zone</div>
      <canvas data-pivot="${s.pivot}" data-entry="${s.entry}"></canvas>
    </div>
    <div class="numbers">
      <div class="num-cell"><div class="lbl">Current Price</div><div class="val c-now">₹${parseFloat(s.price).toLocaleString('en-IN',{minimumFractionDigits:2})}</div></div>
      <div class="num-cell"><div class="lbl">Risk : Reward</div><div class="val c-pur">${rr} : 1</div></div>
      <div class="num-cell"><div class="lbl">Gap to Breakout</div><div class="val c-buy">${dist}%</div></div>
    </div>
    <div class="actions">
      <div class="action-cell"><div class="a-lbl">✅ Buy Entry</div><div class="a-price c-buy">₹${parseFloat(s.entry).toLocaleString('en-IN',{minimumFractionDigits:2})}</div><div class="a-note">Only on high volume</div></div>
      <div class="action-cell"><div class="a-lbl">🛑 Stop Loss</div><div class="a-price c-stop">₹${parseFloat(s.stop_loss).toLocaleString('en-IN',{minimumFractionDigits:2})}</div><div class="a-note">Exit immediately if hit</div></div>
      <div class="action-cell"><div class="a-lbl">🎯 Target 1</div><div class="a-price c-t1">₹${parseFloat(s.target1).toLocaleString('en-IN',{minimumFractionDigits:2})}</div><div class="a-note">Sell 50% here</div></div>
      <div class="action-cell"><div class="a-lbl">🎯 Target 2</div><div class="a-price c-t2">₹${parseFloat(s.target2).toLocaleString('en-IN',{minimumFractionDigits:2})}</div><div class="a-note">Sell remaining 50%</div></div>
    </div>
    <div class="card-foot">
      <span class="tag tb">📊 Stage 2 Uptrend</span>
      <span class="tag ${s.resistance_touches>=3?'tg':'ta'}">🔺 ${s.resistance_touches}× Resistance</span>
      <span class="tag tg">🔇 Volume Dry-up</span>
      ${rsTag}
    </div>
  `;
  return card;
}

async function loadData() {
  document.getElementById('loading').classList.remove('hidden');
  try {
    const data=await (await fetch(`data/results.json?t=${Date.now()}`)).json();
    const dt=new Date(data.generated_at);
    document.getElementById('scan-date').textContent=dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    document.getElementById('scan-time').textContent=dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    const m=document.getElementById('mkt');
    if(data.market_uptrend!==undefined){m.style.display='block';m.className='mkt-strip '+(data.market_uptrend?'up':'down');m.textContent=data.market_uptrend?'✅ NIFTY is rising — Good day for breakouts':'⚠ NIFTY is falling — Skip all trades today';}
    document.getElementById('stats').innerHTML=`
      <div class="stat"><div class="n">${data.total_scanned}</div><div class="l">Scanned</div></div>
      <div class="stat"><div class="n" style="color:#16a34a">${data.total_found}</div><div class="l">Found</div></div>
      <div class="stat"><div class="n" style="color:#d97706">${data.stocks.length}</div><div class="l">Showing</div></div>
      <div class="stat"><div class="n" style="color:#7c3aed">2.5:1</div><div class="l">Min R:R</div></div>`;
    const c=document.getElementById('cards'); c.innerHTML='';
    if(!data.stocks?.length){
      c.innerHTML=`<div class="empty"><h2>No setups today</h2><p>Strict filters found no stocks about to break out.<br>This is normal — 0 to 3 setups per day is expected.</p><p class="ok">✅ Check back tomorrow after 6:30 AM IST</p></div>`;
    } else {
      data.stocks.forEach((s,i)=>c.appendChild(buildCard(s,i+1)));
      requestAnimationFrame(()=>{
        document.querySelectorAll('.card').forEach((card,i)=>{
          const cv=card.querySelector('canvas'), s=data.stocks[i];
          if(cv&&s?.candles) drawChart(cv,s.candles,s.pivot,s.entry);
        });
      });
    }
  } catch(e) {
    document.getElementById('cards').innerHTML=`<div class="empty"><h2>Could not load data</h2><p>Run scanner: GitHub Actions → workflow_dispatch</p></div>`;
  } finally { document.getElementById('loading').classList.add('hidden'); }
}
loadData();
</script>
</body>
</html>
